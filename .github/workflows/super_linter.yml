name: Super-Linter

on:
    push

jobs:
    super-lint:
        name: lint code base
        runs-on: ubuntu-latest
        steps:
            - name : Checkout code
              uses : actions/checkout@v6

            - name : Run super linter
              uses : super-linter/super-linter@v8.7.0
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

        
  
name: Super-Linter

on:
    push

jobs:
    super-lint:
        name: lint code base
        runs-on: ubuntu-latest

        permissions: 
            contents: read
            packages: read

            issues: write
            pull-requests: write

            statuses: write

        steps:
            - name : Checkout code
              uses : actions/checkout@v6
              with:
                fetch-depth: 0
                persist-credentials: false

            - name : Run super linter
              uses : super-linter/super-linter@v8.7.0
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

        
  